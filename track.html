<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Track your order with your order number.">
  <title>SUN&amp;PALM</title>

  <script>
    try {
      var theme = localStorage.getItem("sunpalm-theme");
      if (theme !== "light" && theme !== "dark") theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.setAttribute("data-theme", theme);
    } catch (error) {}
  </script>
  <meta name="theme-color" content="#0f9292">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="images/icons/icon-192.png">
  <link rel="apple-touch-icon" href="images/icons/icon-192.png">
  <link rel="stylesheet" href="css/bootstrap.min.css" id="bootstrap-css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Cairo:wght@400;600;700;800&family=Dancing+Script:wght@500..700&family=Josefin+Sans:wght@300..700&family=Schibsted+Grotesk:wght@600..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>

<body data-page="track" data-title-key="track.title">
  <header id="site-header"></header>

  <main>
    <section class="page-hero">
      <div class="page-hero-bg" style="background-image: url('images/pexels-crisstianpantoja-838879.jpg')"></div>
      <div class="container">
        <nav aria-label="breadcrumb">
          <ol class="sun-breadcrumb">
            <li><a href="index.html" data-i18n="nav.home"></a></li>
            <li aria-current="page" data-i18n="track.title"></li>
          </ol>
        </nav>
        <p class="kicker" data-i18n="track.kicker"></p>
        <h1 class="page-hero-title" data-i18n="track.title"></h1>
        <p class="page-hero-sub" data-i18n="track.subtitle"></p>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <div class="track-wrap">
          <form class="track-form" id="trackForm" role="search">
            <i class="fa-solid fa-receipt" aria-hidden="true"></i>
            <input type="text" id="trackInput" dir="ltr" autocomplete="off" spellcheck="false" maxlength="20" data-i18n-placeholder="track.placeholder" data-i18n-aria="track.placeholder">
            <button type="submit" class="btn-sun"><span data-i18n="track.button"></span> <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i></button>
          </form>
          <p class="track-hint" data-i18n="track.hint"></p>

          <div class="recent-orders" id="recentOrders" hidden>
            <p class="side-label" data-i18n="track.recent"></p>
            <div class="recent-list" id="recentList"></div>
          </div>

          <div id="trackResult" aria-live="polite"></div>
        </div>
      </div>
    </section>
  </main>

  <footer id="site-footer" class="site-footer"></footer>

  <script src="js/bootstrap.bundle.min.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/glasses.js"></script>
  <script src="js/store.js"></script>
  <script src="js/chatbot.js"></script>
  <script src="js/track.js"></script>
  <script src="js/compare.js"></script>
  <script src="js/quiz.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
